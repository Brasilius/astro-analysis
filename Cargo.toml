[package]
name = "astro-analysis"
version = "0.1.0"
edition = "2024"
description = "NOCTILUCA — a violet observatory for your terminal"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
